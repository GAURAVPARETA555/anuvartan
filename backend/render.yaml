# render.yaml — Render Blueprint for Anuvartan Django Backend
# Docs: https://render.com/docs/blueprint-spec
#
# BEFORE USING:
#   1. Replace the `region` value if you want a different Render region.
#   2. Set DJANGO_ALLOWED_HOSTS and CORS_ALLOWED_ORIGINS to your actual domain
#      after Render assigns a hostname, or in the Render dashboard.
#   3. GROQ_API_KEY must be set manually in the Render dashboard (sync: false).
#   4. DJANGO_SECRET_KEY is auto-generated by Render on first deploy (generateValue: true).

services:
  - type: web
    name: anuvartan-backend
    runtime: python
    region: singapore          # Change to: oregon | frankfurt | ohio | virginia
    plan: free                 # Upgrade for always-on / better specs

    # --- Build ---
    # Install deps → collect static files → run migrations
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput

    # --- Start ---
    # Gunicorn with the WSGI entry-point; Render injects $PORT automatically.
    startCommand: "gunicorn anuvartan.wsgi:application --bind 0.0.0.0:$PORT"

    # --- Health Check ---
    # Render will GET /api/health/ every 30 s; must return 2xx.
    healthCheckPath: /api/health/

    # --- Environment Variables ---
    envVars:
      # Django core
      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true       # Render generates a secure random value on first deploy

      - key: DJANGO_ALLOWED_HOSTS
        sync: false               # Set in dashboard after Render assigns a hostname
                                  # Example: anuvartan-backend.onrender.com,api.yourdomain.com

      - key: CORS_ALLOWED_ORIGINS
        sync: false               # Example: https://your-app.com,http://localhost:8081

      # PostgreSQL — auto-populated by Render when linked to the database below
      - key: DATABASE_URL
        fromDatabase:
          name: anuvartan-db
          property: connectionString

      # Groq AI Integration
      - key: GROQ_API_KEY
        sync: false               # Paste your key in the Render dashboard — never commit it

      - key: GROQ_CHAT_MODEL
        value: "qwen/qwen3.8-27b"

      # Python runtime
      - key: PYTHON_VERSION
        value: "3.12.10"          # Match your local Python version

databases:
  - name: anuvartan-db
    databaseName: anuvartan_db
    user: anuvartan_user
    plan: free                    # Render free PostgreSQL expires after 30 days (per Render docs)
    region: singapore             # Must match the web service region above
